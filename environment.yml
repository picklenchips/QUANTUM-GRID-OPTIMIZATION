# to create new miniconda/anaconda environment:
## conda env create -f environment.yml; conda activate qpowergrid
name: qpgrid
channels:
  - defaults
  - conda-forge
dependencies:
# classiq only runs up to 3.13, not 3.14
# so we only install python up to 3.13
  - python==3.13 
  - ipykernel  # for jupyter notebooks
  - marimo
  - numpy
# DOWNLOAD FROM OSM
  - requests
# PANDAPOWER + REQUIREMENTS
  - pandapower
  - pytest
  - scipy
  - pandas
  - packaging
  - tqdm
  - deepdiff
  - psycopg2  # PostgreSQL adapter
  - networkx  # for general graphs
  - numba     # improves performance
  - ortools-python   # google mixed-integer programming optimization tools (conda-forge package is "ortools-python", not "ortools")
### pandapower.plotting
  - python-igraph
  - geopandas
  - geojson
# PLOTTING
  - matplotlib
  - python-igraph  # plotting
  - plotly
  - nbformat       # plotly in ipynb
  - geopy
# QUANTUM
#  - pip  # to install classiq
#  - pip:
#    - classiq  
  # or qiskit:
#  - qiskit-terra  # conda-forge::
  - dwave-ocean-sdk>=9,<10  # dwavebinarycsp was removed in 9.0.0 -- pin deliberately, not accidentally
# OTHERS
#  - pyvis   # conda-forge::
#  - pytorch  # for GNN
  # to install classiq: